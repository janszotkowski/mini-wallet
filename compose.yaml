services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"

volumes:
  postgres-data: